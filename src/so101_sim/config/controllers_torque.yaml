# 力矩控制链路控制器配置 (plan/robotics.md Phase 0)
# ForwardCommandController 直接转发 effort 命令到 hardware interface,
# 上层由 torque_control_node 计算力矩 (tau = g(q) + PD + 前馈)。
# 注意: update_rate 与位置版保持 100 Hz, Phase 4/5 联调时再实测调优。
controller_manager:
  ros__parameters:
    update_rate: 100
    use_sim_time: false

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    arm_controller:
      type: forward_command_controller/ForwardCommandController
    gripper_controller:
      type: forward_command_controller/ForwardCommandController

arm_controller:
  ros__parameters:
    joints:
      - shoulder_pan
      - shoulder_lift
      - elbow_flex
      - wrist_flex
      - wrist_roll
    interface_name: effort
    use_sim_time: true

gripper_controller:
  ros__parameters:
    joints:
      - gripper
    interface_name: effort
    use_sim_time: true
