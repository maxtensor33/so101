[project]
name = "so101"
version = "0.1.0"
description = "SO-ARM101 ROS2 + MuJoCo/Gazebo + MoveIt2 + Pinocchio workspace tooling"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mujoco>=3.2",
    "numpy>=2",
    "pytest>=8.0",
    "pytest-cov>=7.1.0",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "python-xlib>=0.33",
    "lark>=1.3.1",
    "gymnasium>=1.0",
    "torch==2.11.0+cu130",
    "torchvision==0.26.0+cu130",
    "torchcodec==0.11.1+cu130",
    "stable-baselines3>=2.4",
    "skrl>=1.4",
    "pin==3.4.0",
    "lerobot[all]==0.6.1",
]

# 默认源走清华 PyPI 镜像；torch 三件套来自阿里云 pytorch-wheels cu130 扁平目录
# （find-links 接入；+cu130 local version 固定，与 conda lerobot 环境一致）
[tool.uv]
find-links = ["https://mirrors.aliyun.com/pytorch-wheels/cu130/"]
# gym-aloha(lerobot[all] 带入, 本项目不 import)把 mujoco 压到 <3.9，破坏 envs 抓取物理
# （test_lift_grasp_teleported_item 在 3.8.1 失败）—— override 回 3.16 线
override-dependencies = ["mujoco>=3.9"]

[[tool.uv.index]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
docs = [
    "myst-parser>=2",
    "sphinx>=7",
    "sphinx-rtd-theme>=2",
]

# libs/ 下为非 ROS 纯 Python 库 (plan/robotics.md, plan/envs.md): uv 安装后可 import
[tool.hatch.build.targets.wheel]
packages = ["libs/so101_robotics", "libs/so101_envs", "libs/so101_rl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:launch_testing -p no:launch_pytest -p no:launch_ros"
# src/ 下的 ROS 包不装 wheel，pytest 经 pythonpath 导入 so101_teleop（契约测试锚定协议实现）
pythonpath = ["src/so101_teleop", "src/so101_il_sim_infer"]
