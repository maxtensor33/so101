[project]
name = "so101"
version = "0.1.0"
description = "SO-ARM101 ROS2 + MuJoCo/Gazebo + MoveIt2 + Pinocchio workspace tooling"
requires-python = ">=3.12"
dependencies = [
    "mujoco>=3.2",
    "numpy>=1.26,<2",
    "pytest>=8.0",
    "pytest-cov>=7.1.0",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "python-xlib>=0.33",
    "lark>=1.3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# so101_robotics 位于 libs/ 下 (plan/robotics.md): uv 安装后 ROS 节点可 import
[tool.hatch.build.targets.wheel]
packages = ["libs/so101_robotics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:launch_testing -p no:launch_pytest -p no:launch_ros"
